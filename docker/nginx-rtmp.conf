user  www-data;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

# pid        /run/nginx-rtmp.pid;

#load_module /opt/nginx-with-rtmp/modules/ngx_rtmp_module.so;

events {
    worker_connections  1024;
}


rtmp {
    max_streams 64;
    max_connections 1024;

    buflen 1s;
    max_message 300k;

    server {
        listen 1935;
        chunk_size 4000;

        include apps-enabled/*.conf;

    }
}

