services:
  nginx-rtmp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx-rtmp
    volumes:
      - ../:/app
      - ./config/nginx/ssl:/etc/nginx/ssl
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - nginx-rtmp-log:/var/log/nginx
      - nginx-rtmp-cache:/var/cache/nginx-rtmp
    ports:
      - 1935:1935
      - 8080:80
      - 8443:443
volumes:
  nginx-rtmp-log: {}
  nginx-rtmp-cache: {}
